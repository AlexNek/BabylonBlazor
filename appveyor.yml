version: 1.5.1.{build}

branches:
  only:
  - master

skip_tags: true
image: Visual Studio 2026
configuration: Release

environment:
  DOTNET_NOLOGO: true
  IGNORE_NORMALISATION_GIT_HEAD_MOVE: 1

dotnet_csproj:
  patch: true
  file: '**\*.csproj'
  version: '{version}'
  version_prefix: '{version}'
  package_version: '{version}'
  assembly_version: '{version}'
  file_version: '{version}'
  informational_version: '{version}'

nuget:
  project_feed: true

before_build:
- ps: dotnet restore

build:
  project: Babylon.Blazor.Lib\Babylon.Blazor.csproj
  publish_nuget: true
  verbosity: minimal

artifacts:
- path: Babylon.Blazor.Lib\bin\Release\net10.0\Babylon.Blazor.dll
  name: Babylon.BlazorLib

deploy:
- provider: GitHub
  auth_token:
    secure: F/19bv2TYoeZ5LhzsKZUeVYgpbI53wUcX8RSHE9+T8CD1Q6tXF+3IBU5xe2YyQQx
  artifact: Babylon.BlazorLib
  force_update: true

- provider: NuGet
  api_key:
    secure: zdMURuxrFA0XFD3PwIiaJnqNr6rxpERR6bw5EPH56bq77OkYhvwHFQNcfOjglP0t
  username:
    secure: h6CRIKObf4nhhTABK4DaJA==
  skip_symbols: true
  on:
    branch: master

notifications:
- provider: Email
  to:
  - alexnek@russinger.com
  subject: 'appveyor - Build status: {{status}}, project: {{projectName}}, version: {{buildVersion}}'
  on_build_success: true
  on_build_failure: true
  on_build_status_changed: false
