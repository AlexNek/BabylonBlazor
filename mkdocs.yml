site_name: Babylon.Blazor Developer Manual
site_description: Developer manual for Babylon.Blazor — Babylon.js 3D wrapper for Blazor with chemical molecule visualization
site_url: https://alexnek.github.io/BabylonBlazor/
repo_url: https://github.com/AlexNek/BabylonBlazor
repo_name: AlexNek/BabylonBlazor

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - Custom Scene: getting-started/custom-scene.md
  - Core Concepts:
      - BabylonCanvas Component: core-concepts/babylon-canvas.md
      - Instance Creator: core-concepts/instance-creator.md
      - JavaScript Interop: core-concepts/js-interop.md
  - Chemical Visualization:
      - Chemical Data: chemical-visualization/chemical-data.md
      - Molecule Creator: chemical-visualization/molecule-creator.md
  - 3D Primitives:
      - Meshes: 3d-primitives/meshes.md
      - Materials and Textures: 3d-primitives/materials.md
      - Sprites: 3d-primitives/sprites.md
  - API Reference: api-reference/overview.md
  - FAQ: faq.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AlexNek/BabylonBlazor
